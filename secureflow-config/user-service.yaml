server:
  port: 8081

spring:
  application:
    name: user-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE