server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - SaveSession
            - TokenRelay

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - SaveSession
            - TokenRelay

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - SaveSession
            - TokenRelay

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - SaveSession
            - TokenRelay

management:
  endpoint:
    gateway:
      enabled: true

  endpoints:
    web:
      exposure:
        include: gateway,health,info

logging:
  level:
    org.springframework.security.oauth2.client: TRACE
    org.springframework.security.oauth2.client.web.server: TRACE
    org.springframework.cloud.gateway.filter.factory.TokenRelayGatewayFilterFactory: TRACE