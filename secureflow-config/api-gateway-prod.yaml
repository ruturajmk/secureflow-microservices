spring:
  security:
    oauth2:
      client:

        registration:

          gateway:
            provider: auth-server
            client-id: gateway-client
            client-secret: ${GATEWAY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

            scope:
              - openid
              - profile
              - read

        provider:

          auth-server:
            authorization-uri: https://auth.company.com/oauth2/authorize
            token-uri: https://auth.company.com/oauth2/token
            jwk-set-uri: https://auth.company.com/oauth2/jwks
            user-info-uri: https://auth.company.com/userinfo
            user-name-attribute: sub

eureka:
  client:
    service-url:
      defaultZone: https://eureka.company.com/eureka

management:
  zipkin:
    tracing:
      endpoint: https://zipkin.company.com/api/v2/spans