apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: secureflow
  labels:
    app: order-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service

          image: secureflow/order-service:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8083

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s

            - name: CONFIG_SERVER
              value: http://config-server:8888