apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: secureflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
      - name: api-gateway

        image: secureflow/api-gateway:latest

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080

        env:
        - name: SPRING_PROFILES_ACTIVE
          value: k8s

        - name: CONFIG_SERVER
          value: http://config-server:8888