architecture: single-broker

image:
  repository: docker.io/apache/kafka
  tag: "4.3.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

config:
  autoCreateTopicsEnabled: true
  deleteTopicEnabled: true
  numPartitions: 3
  logRetentionHours: 72

singleBroker:
  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

metrics:
  enabled: false