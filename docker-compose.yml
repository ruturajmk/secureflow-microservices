services:

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: secureflow/config-server:1.0
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native,docker
      CONFIG_REPO: file:///config-repo
    volumes:
      - ./secureflow-config:/config-repo:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - secureflow-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - secureflow-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - secureflow-network
      
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - secureflow-network
      
  mysql:
    image: mysql:8.4
    container_name: mysql

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_USER: root

    volumes:
      - mysql-data:/var/lib/mysql

    restart: unless-stopped

    networks:
      - secureflow-network

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - secureflow-network
      
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - secureflow-network
      
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - secureflow-network

  service-registry:
    build: 
       context: ./service-registry
    image: secureflow/service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      
      ZIPKIN_SERVER: http://zipkin:9411/api/v2/spans
    depends_on:
      - zipkin
    networks:
      - secureflow-network

  auth-server:
    build:
      context: ./auth-server
    image: secureflow/auth-server
    container_name: auth-server
    ports:
      - "9000:9000"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER: http://config-server:8888
      AUTH_SERVER: http://localhost:9000
      EUREKA_SERVER: http://service-registry:8761/eureka
      ZIPKIN_SERVER: http://zipkin:9411/api/v2/spans

    depends_on:
      - config-server
      - service-registry
    restart: unless-stopped
    networks:
      - secureflow-network
      
  api-gateway:
    build: 
      context: ./api-gateway
    image: secureflow/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      DEBUG: "true"
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER: http://config-server:8888
      AUTH_SERVER_PUBLIC: http://localhost:9000
      AUTH_SERVER: http://auth-server:9000
      EUREKA_SERVER: http://service-registry:8761/eureka
      KAFKA_SERVER: kafka:29092
      ZIPKIN_SERVER: http://zipkin:9411/api/v2/spans
    depends_on:
      - auth-server
      - service-registry
    restart: unless-stopped
    networks:
      - secureflow-network

  user-service:
    build: 
      context: ./user-service
    image: secureflow/user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER: http://config-server:8888
      AUTH_SERVER: http://auth-server:9000
      EUREKA_SERVER: http://service-registry:8761/eureka
      ZIPKIN_SERVER: http://zipkin:9411/api/v2/spans
    depends_on:
      - auth-server
    restart: unless-stopped
    networks:
      - secureflow-network

  product-service:
    build: 
      context: ./product-service
    image: secureflow/product-service:1.0
    
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER: http://config-server:8888
      AUTH_SERVER: http://auth-server:9000
      EUREKA_SERVER: http://service-registry:8761/eureka
      ZIPKIN_SERVER: http://zipkin:9411/api/v2/spans
    depends_on:
      - auth-server
    restart: unless-stopped
    networks:
      - secureflow-network
      
  inventory-service:
    build: 
      context: ./inventory-service
    image: secureflow/inventory-service
    container_name: inventory-service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER: http://config-server:8888
      AUTH_SERVER: http://auth-server:9000
      EUREKA_SERVER: http://service-registry:8761/eureka
      KAFKA_SERVER: kafka:29092
      ZIPKIN_SERVER: http://zipkin:9411/api/v2/spans
    depends_on:
      - mysql
      - kafka
      - service-registry
    restart: unless-stopped
    networks:
      - secureflow-network
      
  payment-service:
    build: 
      context: ./payment-service
    image: secureflow/payment-service
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER: http://config-server:8888
      AUTH_SERVER: http://auth-server:9000
      EUREKA_SERVER: http://service-registry:8761/eureka
      KAFKA_SERVER: kafka:29092
      ZIPKIN_SERVER: http://zipkin:9411/api/v2/spans
    depends_on:
      - kafka
      - service-registry
    restart: unless-stopped
    networks:
      - secureflow-network
      
  notification-service:
    build: 
      context: ./notification-service
    image: secureflow/notification-service
    container_name: notification-service
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER: http://config-server:8888
      EUREKA_SERVER: http://service-registry:8761/eureka
      KAFKA_SERVER: kafka:29092
      ZIPKIN_SERVER: http://zipkin:9411/api/v2/spans
    depends_on:
      - kafka
      - service-registry
    restart: unless-stopped
    networks:
      - secureflow-network

  order-service:
    build: 
      context: ./order-service
    image: secureflow/order-service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER: http://config-server:8888
      AUTH_SERVER: http://auth-server:9000
      EUREKA_SERVER: http://service-registry:8761/eureka
      KAFKA_SERVER: kafka:29092
      ZIPKIN_SERVER: http://zipkin:9411/api/v2/spans
    depends_on:
      - kafka
      - service-registry
      - auth-server
    restart: unless-stopped
    networks:
      - secureflow-network
      
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - secureflow-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.4
    container_name: logstash
    ports:
      - "5000:5000"
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    networks:
      - secureflow-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - secureflow-network

volumes:
  mysql-data:
  elasticsearch-data:

networks:
  secureflow-network:
    driver: bridge
    

